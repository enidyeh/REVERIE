name: Deploy to GitHub Pages

# 把构建产物发布到 GitHub Pages（https://enidyeh.github.io/REVERIE/）。
# 仓库页面在子路径下，所以构建时传入 VITE_BASE=/REVERIE/（见 vite.config.ts）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint + 断言 + 构建，构建出的 dist 就是要发布的产物。
      - run: npm run check
        env:
          VITE_BASE: /REVERIE/
      # 说明：仓库第一次发布前需要在 Settings → Pages 把 Source 选为「GitHub Actions」（只需一次）。
      # 试过用 actions/configure-pages 的 enablement 自动开启，但默认 token 会被拒（Resource not accessible by integration），
      # 所以这里不再调用它，只负责上传产物与发布。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
