name: Deploy to GitHub Pages

# 把构建产物发布到 GitHub Pages（https://enidyeh.github.io/REVERIE/）。
# 仓库页面在子路径下，所以构建时传入 VITE_BASE=/REVERIE/（见 vite.config.ts）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint + 断言 + 构建，构建出的 dist 就是要发布的产物。
      - run: npm run check
        env:
          VITE_BASE: /REVERIE/
      - uses: actions/configure-pages@v5
        with:
          # 仓库还没开启 Pages 时由这一步开启（需要 pages: write 权限）。
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
